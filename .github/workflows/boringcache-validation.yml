name: BoringCache validation — fixpp ccache retention
run-name: BoringCache validation — fixpp ${{ inputs.source_ref }}

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact upstream commit to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: boringcache-fixpp-validation
  cancel-in-progress: false

env:
  CONAN_HOME: ~/.conan2
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CCACHE_COMPILERCHECK: content
  CCACHE_COMPRESSLEVEL: "5"
  CCACHE_DIR: /tmp/fixpp-ccache-linux-clang-debug
  CCACHE_VERSION: "4.14"
  CCACHE_SHA256: c64760b0b85ba86068f4cd162dc42e2dc39c6f46b0cb8c1990dfccbec7a1fed0
  CCACHE_STORAGE_HTTP_VERSION: "0.9"
  CCACHE_STORAGE_HTTP_SHA256: 875dbf6d575d06e4c4492f1ba639beb68530bc23382031a6bacc767cded9f463

jobs:
  publish:
    name: Publish linux-clang-debug compiler cache
    if: github.repository == 'boringcache/fixpp' && github.ref == 'refs/heads/boringcache-validation'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout the validation plan
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: boringcache-validation
          path: .boringcache-plan
          persist-credentials: false

      - name: Checkout the upstream source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          path: source
          persist-credentials: false

      - name: Free disk space for the debug build
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Install Clang 22, GCC 13, and Ninja
        working-directory: source
        run: |
          wget -O /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          ci/apt-guard.sh llvm-toolchain -- sudo /tmp/llvm.sh 22 all
          CLANG_BIN=$(find /usr/bin -maxdepth 1 \( -type f -o -type l \) -name 'clang++-*' -print | sort -V | tail -1)
          CLANG_VER=${CLANG_BIN##*-}
          test -n "$CLANG_VER"
          sudo ln -sf "/usr/bin/clang-$CLANG_VER" /usr/bin/clang
          sudo ln -sf "/usr/bin/clang++-$CLANG_VER" /usr/bin/clang++
          clang++ --version
          ci/apt-guard.sh apt-install -- sudo apt-get install -y --no-install-recommends \
            gcc-13 g++-13 ninja-build swig python3-dev python3-pip pipx

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12"

      - name: Install Conan and Python test dependencies
        run: |
          pipx install conan
          pip install pytest pyyaml
          conan --version

      - name: Configure Conan
        run: |
          conan profile detect --force
          mkdir -p ~/.conan2
          printf '%s\n' \
            'compiler:' \
            '  clang:' \
            '    version: ["19", "20", "21", "22", "23"]' \
            > ~/.conan2/settings_user.yml

      - name: Set up ORAS for fixpp's existing Conan cache
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Restore fixpp's existing Conan cache
        working-directory: source
        run: ci/restore-conan-cache.sh linux-clang-debug

      - name: Install ccache and its HTTP storage helper
        run: |
          ccache_archive="ccache-${CCACHE_VERSION}-linux-x86_64-glibc.tar.gz"
          curl --fail --location --show-error --silent --retry 5 --retry-all-errors --retry-delay 5 \
            "https://github.com/ccache/ccache/releases/download/v${CCACHE_VERSION}/${ccache_archive}" \
            --output "${RUNNER_TEMP}/${ccache_archive}"
          echo "${CCACHE_SHA256}  ${RUNNER_TEMP}/${ccache_archive}" | sha256sum --check
          tar xzf "${RUNNER_TEMP}/${ccache_archive}" -C "${RUNNER_TEMP}"
          sudo install -m 0755 \
            "${RUNNER_TEMP}/ccache-${CCACHE_VERSION}-linux-x86_64-glibc/ccache" \
            /usr/local/bin/ccache

          helper_archive="ccache-storage-http-go-${CCACHE_STORAGE_HTTP_VERSION}-linux-amd64.tar.gz"
          curl --fail --location --show-error --silent --retry 5 --retry-all-errors --retry-delay 5 \
            "https://github.com/ccache/ccache-storage-http-go/releases/download/v${CCACHE_STORAGE_HTTP_VERSION}/${helper_archive}" \
            --output "${RUNNER_TEMP}/${helper_archive}"
          echo "${CCACHE_STORAGE_HTTP_SHA256}  ${RUNNER_TEMP}/${helper_archive}" | sha256sum --check
          tar xzf "${RUNNER_TEMP}/${helper_archive}" -C "${RUNNER_TEMP}"
          sudo install -m 0755 \
            "${RUNNER_TEMP}/ccache-storage-http-go-${CCACHE_STORAGE_HTTP_VERSION}-linux-amd64/ccache-storage-http" \
            /usr/local/bin/ccache-storage-http

      - name: Configure BoringCache ccache publishing
        uses: boringcache/one@1039999c65011be670f5655e0e48ad556188ab12 # v1.30.4
        with:
          working-directory: .boringcache-plan
          trust-policy: publish
          mode: ccache
          diagnostics: summary
          fail-on-cache-error: true

      - name: Resolve Conan dependencies
        working-directory: source
        run: |
          conan export conan/recipes/civetweb --version 1.16
          conan install . \
            -pr conan/profiles/linux-clang-debug \
            --build=missing \
            -of build/linux-clang-debug

      - name: Check the dependency build configuration
        working-directory: source
        run: ci/assert-sanitized-deps.sh linux-clang-debug build/linux-clang-debug

      - name: Resolve fixpp's Python build configuration
        id: python_build
        working-directory: source
        run: ci/derive-python-sanitizer.sh linux-clang-debug >> "$GITHUB_OUTPUT"

      - name: Configure fixpp
        working-directory: source
        run: >-
          cmake --preset linux-clang-debug
          -DFIXPP_ARTIFACT_DIR=${{ github.workspace }}/source/_artifacts
          -DFIXPP_BUILD_PYTHON=ON
          -DFIXPP_INSTALL_PYTHON=${{ steps.python_build.outputs.install_python }}
          -DFIXPP_PY_INSTALL_LAYOUT=${{ steps.python_build.outputs.py_layout }}
          -DFIXPP_PYTHON_SANITIZER=${{ steps.python_build.outputs.sanitizer }}

      - name: Build fixpp
        working-directory: source
        run: cmake --build --preset linux-clang-debug

  restore:
    name: Restore linux-clang-debug compiler cache on a clean runner
    needs: publish
    if: github.repository == 'boringcache/fixpp' && github.ref == 'refs/heads/boringcache-validation'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout the validation plan
